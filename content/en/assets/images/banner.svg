<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <style>
      .logo-symbol {
        stroke: #0070f3;
      }
      .logo-text {
        fill: #1e293b;
      }
      @media (prefers-color-scheme: dark) {
        .logo-symbol {
          stroke: #60a5fa;
        }
        .logo-text {
          fill: #f8fafc;
        }
      }
    </style>
  </defs>
  <!-- Logo Symbol -->
  <g class="logo-symbol" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10) scale(0.8)">
    <path d="M35 30 L15 50 L35 70"/>
    <line x1="60" y1="20" x2="40" y2="80"/>
    <path d="M65 30 L85 50 L65 70"/>
  </g>
  <!-- Text -->
  <text x="100" y="62" class="logo-text" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="38" font-weight="700">landerox.com</text>
</svg>
