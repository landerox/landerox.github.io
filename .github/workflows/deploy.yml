name: CD · Deploy to Pages
run-name: >-
  Deploy · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'push' && github.event.head_commit.message
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'includes/**'
      - 'overrides/**'
      - 'scripts/**'
      - 'zensical.toml'
      - 'zensical.es.toml'
      - '.config/404-router.html'
      - '.github/workflows/deploy.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Justfile'
  # No paths filter here on purpose: `build` is a required status check,
  # and a filtered job reports nothing on PRs that miss the filter, which
  # leaves them permanently unmergeable.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Production deploys serialize under their own group and are never
# cancelled mid-flight; PR builds cancel per ref as usual. A single
# shared group would let a new PR abort a deploy already in progress.
concurrency:
  group: >-
    pages-${{ github.event_name == 'pull_request'
    && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # `just build` runs the glossary check, a Node script.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          # Pinned to the local install; SoT table in docs/decisions.md § 14.
          just-version: "1.58.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build site
        run: just build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
