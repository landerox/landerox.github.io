name: CI · Lint
run-name: >-
  Lint · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'push' && github.event.head_commit.message
    || github.event_name == 'schedule' && 'daily audit'
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          # Pinned to the local install; SoT table in docs/decisions.md § 14.
          just-version: "1.59.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test hook preparation
        run: just test-hooks

      - name: Identify hook cache
        id: hook_cache_key
        run: uv run python scripts/install_precommit_hooks.py --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook_cache_key.outputs.key }}

      - name: Prepare pre-commit environments
        run: uv run python scripts/install_precommit_hooks.py

      # Includes the Python dependency audit: the pip-audit hook runs
      # `just audit`.
      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files
