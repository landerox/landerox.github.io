name: CI · Lint
run-name: >-
  Lint · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'push' && github.event.head_commit.message
    || github.event_name == 'schedule' && 'daily audit'
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          # Pinned to the local install; SoT table in docs/decisions.md § 14.
          just-version: "1.58.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test hook preparation
        run: uv run python -m unittest discover -s scripts -p test_install_precommit_hooks.py

      - name: Identify hook cache
        id: hook_cache_key
        run: uv run python scripts/install_precommit_hooks.py --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook_cache_key.outputs.key }}

      - name: Prepare pre-commit environments
        run: uv run python scripts/install_precommit_hooks.py

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

      # Delegates to the `just audit` recipe rather than restating the
      # export/ignore invocation: a second copy is a second place for the
      # ignore list to drift out of sync with local runs.
      - name: Audit Python dependencies
        run: just audit
