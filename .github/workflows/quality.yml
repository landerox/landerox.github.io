name: Quality · Lighthouse
run-name: >-
  Lighthouse · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'push' && github.event.head_commit.message
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "includes/**"
      - "overrides/**"
      - "scripts/**"
      - "zensical.toml"
      - "zensical.es.toml"
      - ".config/404-router.html"
      - ".github/workflows/quality.yml"
      - ".config/lighthouserc.json"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Justfile"
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "includes/**"
      - "overrides/**"
      - "scripts/**"
      - "zensical.toml"
      - "zensical.es.toml"
      - ".config/404-router.html"
      - ".github/workflows/quality.yml"
      - ".config/lighthouserc.json"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "Justfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    # The browser suite plus 42 URLs x 3 Lighthouse runs; 38 URLs took about
    # 27 minutes in CI.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          # Pinned to the local install; SoT table in docs/decisions.md § 14.
          just-version: "1.59.0"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build site (EN + ES)
        run: just build

      - name: Install browser from the locked Playwright release
        run: uv run playwright install --with-deps chromium

      - name: Check bilingual browser interactions
        run: just test-browser

      - name: Run Lighthouse CI
        run: just lighthouse-audit

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-results
          path: lhci-reports
