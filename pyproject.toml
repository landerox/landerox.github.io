[project]
name = "landerox-website"
version = "0.1.0"
description = "Source code of landerox.com, the bilingual (EN/ES) site of Fernando Landero, Senior Consultant & Engineer in Cloud, Data & AI Platforms. Powered by Zensical."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pillow>=13.0.0",
    "zensical>=0.0.71",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "commitizen>=4.19.2",
    "pip-audit>=2.10.1",
    "playwright>=1.64.0",
    "pre-commit>=4.7.0",
]

[project.urls]
Homepage = "https://landerox.com"
Repository = "https://github.com/landerox/landerox.github.io"
Issues = "https://github.com/landerox/landerox.github.io/issues"

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:^version"]
pre_bump_hooks = [
    "uv sync",
    "git add uv.lock"
]

# Lint only. The formatter is not adopted yet: it would rewrite most of
# scripts/ in one pass; see docs/decisions.md.
[tool.ruff]
target-version = "py314"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [
  # Long assertions and locator chains stay on one line.
  "E501",
  # Prose in strings, comments and docstrings uses typographic dashes and ×.
  "RUF001",
  "RUF002",
  "RUF003",
]
